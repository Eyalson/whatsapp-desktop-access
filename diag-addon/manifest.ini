name = whatsappFocusDiag
summary = "WhatsApp focus diagnostics"
description = """Writes one NVDA log line per focus event, to find where unexpected focus changes come from while typing in WhatsApp Desktop. Message text is never logged. It runs on every focus event in every application and slows focus changes down, so install it only while diagnosing."""
