name = whatsappDesktopAccess
summary = "WhatsApp Desktop Access"
description = """Accessibility improvements for WhatsApp Desktop on Windows. Keeps NVDA on the message field while typing, and adds commands to move to the chat list, the message list and the message field."""
author = "Sontech - Eyal Sonsino"
url = https://github.com/Eyalson/whatsapp-desktop-access
version = 1.0.0
docFileName = readme.html
changelog = """First release. NVDA no longer loses the message field after you select and delete text, so typed characters keep being echoed. Adds Alt+1, Alt+2 and Alt+D to move to the chat list, the newest message and the message field."""
minimumNVDAVersion = 2026.1
lastTestedNVDAVersion = 2026.2
updateChannel = None
