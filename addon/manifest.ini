name = whatsappDesktopAccess
summary = "WhatsApp Desktop Access"
description = """Accessibility improvements for WhatsApp Desktop on Windows. Keeps NVDA on the message field while typing, reads what is under the mouse, and adds commands to move to the chat list, the message list and the message field."""
author = "Sontech - Eyal Sonsino"
url = https://sontech.co.il/en/
version = 1.1.0
docFileName = readme.html
changelog = """NVDA now reads what is under the mouse in WhatsApp, including the title bar and the window buttons. Buttons, text fields, sliders and other controls are announced like a focus change when the mouse enters them, for example the Play voice message button. Alt+1, Alt+2 and Alt+D announce the target when the focus is already there. Alt+1 also finds the first chat when the chat list starts with something else."""
minimumNVDAVersion = 2026.1
lastTestedNVDAVersion = 2026.2
updateChannel = None
